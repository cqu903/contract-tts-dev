[project]
name = "cantonese-contract-tts"
version = "0.0.0"
description = "Contract-TTS service with multilingual segmentation, content-addressed audio, and selectable GPT-SoVITS, CosyVoice, or Microsoft providers."
requires-python = ">=3.12"
dependencies = [
    "azure-cognitiveservices-speech>=1.50.0,<2",
    "cn2an>=0.5.24",
    "dashscope>=1.26.5",
    "edge-tts>=7.2.8,<8",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "opencc-python-reimplemented>=0.1.7",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
