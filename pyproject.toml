[project]
name = "audio-with-qwen3-tts"
version = "0.0.0"
description = "Local capability-boundary validation of mlx-audio + Qwen3-TTS (粤/普/英). A validation spike, not a service."
requires-python = ">=3.12"
dependencies = [
    "cn2an>=0.5.24",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlx-audio>=0.4.5",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
