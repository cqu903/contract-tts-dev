[project]
name = "cantonese-contract-tts"
version = "0.0.0"
description = "Cantonese contract-TTS service: external TXT upload, content-addressed segmentation + per-segment normalization + seek, on GPT-SoVITS (local) or Bailian CosyVoice (cloud)."
requires-python = ">=3.12"
dependencies = [
    "cn2an>=0.5.24",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
